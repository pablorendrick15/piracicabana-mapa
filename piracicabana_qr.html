<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piracicabana - QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#000;color:#00ff41;
  font-family:'Share Tech Mono',monospace;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,255,65,.03) 0px,rgba(0,255,65,.03) 1px,transparent 1px,transparent 3px);
  z-index:0;
}
.card{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  border:1px solid #00ff4155;
  border-radius:4px;
  padding:32px 36px 28px;
  background:rgba(0,20,0,.7);
  box-shadow:0 0 40px rgba(0,255,65,.1),inset 0 0 30px rgba(0,255,65,.03);
  max-width:340px;width:100%;
}
h1{
  font-family:'Orbitron',sans-serif;
  font-size:18px;letter-spacing:.2em;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:4px;
  text-shadow:0 0 20px rgba(0,255,65,.5);
}
.sub{
  font-size:10px;color:#00ff4177;letter-spacing:.12em;
  text-transform:uppercase;text-align:center;
  margin-bottom:24px;
}
.qr-wrapper{
  position:relative;
  margin-bottom:22px;
}
#qr-container{
  position:relative;z-index:1;
  background:#fff;
  padding:14px;
  border-radius:3px;
  display:block;
  border:2px solid #00ff41;
  animation:glow-breathe 3s ease-in-out infinite;
}
@keyframes glow-breathe{
  0%,100%{box-shadow:0 0 8px 2px rgba(0,255,65,.3),0 0 20px 4px rgba(0,255,65,.15);border-color:#00ff41;}
  50%{box-shadow:0 0 24px 6px rgba(0,255,65,.6),0 0 48px 12px rgba(0,255,65,.2);border-color:#00ffaa;}
}
.btn-group{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%;}
.btn{
  background:transparent;
  border:1px solid #00ff41;
  color:#00ff41;
  padding:11px 20px;
  font-size:12px;
  cursor:pointer;
  border-radius:2px;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Share Tech Mono',monospace;
  transition:.15s,box-shadow .15s;
  touch-action:manipulation;
}
.btn:hover,.btn:active{background:#00ff4118;box-shadow:0 0 12px rgba(0,255,65,.25);}
.btn.primary{border-color:#00ff41;color:#000;background:#00ff41;font-weight:bold;}
.btn.primary:hover{background:#00dd38;}
.card::before,.card::after{
  content:'';position:absolute;width:12px;height:12px;
  border-color:#00ff41;border-style:solid;
}
.card::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:3px 0 0 0;}
.card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 3px 0;}
@media print{
  .btn-group{display:none!important;}
  body{background:#fff;color:#000;}
  body::before{display:none;}
  .card{border:1px solid #ccc;box-shadow:none;background:#fff;}
  h1,.sub{color:#000;}
  #qr-container{border:2px solid #000;box-shadow:none;animation:none;}
}
</style>
</head>
<body>
<div class="card">
  <h1>Piracicabana</h1>
  <div class="sub">Escaneie para abrir a página de usuário</div>
  <div class="qr-wrapper">
    <div id="qr-container"></div>
  </div>
  <div class="btn-group">
    <a class="btn primary" href="piracicabana_int.html">Abrir Login</a>
    <button class="btn" onclick="window.print()">&#128438; Imprimir QR</button>
  </div>
</div>
<script>
new QRCode(document.getElementById("qr-container"), {
  text: "https://pablorendrick15.github.io/piracicabana-mapa/piracicabana_int.html",
  width: 240,
  height: 240,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
