<script>
(function () {
  const busGroup  = document.getElementById('bus-group');
  const passenger = document.getElementById('passenger');
  const pHead     = document.getElementById('p-head');
  const pBody     = document.getElementById('p-body');
  const pArmL     = document.getElementById('parm-l');
  const pArmR     = document.getElementById('parm-r');
  const pLegL     = document.getElementById('p-leg-l');
  const pLegR     = document.getElementById('p-leg-r');
  const doorLeft  = document.getElementById('door-left');
  const doorRight = document.getElementById('door-right');
  const wheelR    = document.getElementById('wr');
  const wheelF    = document.getElementById('wf');
  const easeOut   = t => 1 - Math.pow(1 - t, 3);
  const easeIn    = t => t * t * t;
  const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  const lerp      = (a,b,t) => a + (b-a)*t;
  const T = { busArrive:[0,1400], doorOpen:[1400,1700], passWalk:[1400,2100], passBoard:[2100,2600], doorClose:[2600,2900], busLeave:[2900,4400], reset:6000 };
  const PASS_START_X=65, PASS_DOOR_X=42, BUS_START_X=220, BUS_PARK_X=10, BUS_END_X=-200;
  let wheelAngle=0, lastTime=null, loopStart=null;
  function frac(now,phase){const[s,e]=phase;return Math.max(0,Math.min(1,(now-s)/(e-s)));}
  function moveBus(x){busGroup.setAttribute('transform',`translate(${x},0)`);}
  function setPassengerX(x){const dx=x-PASS_START_X;pHead.setAttribute('cx',PASS_START_X+dx);pBody.setAttribute('x1',PASS_START_X+dx);pBody.setAttribute('x2',PASS_START_X+dx);pArmL.setAttribute('x1',PASS_START_X+dx);pArmL.setAttribute('x2',58+dx);pArmR.setAttribute('x1',PASS_START_X+dx);pArmR.setAttribute('x2',72+dx);pLegL.setAttribute('x1',PASS_START_X+dx);pLegL.setAttribute('x2',61+dx);pLegR.setAttribute('x1',PASS_START_X+dx);pLegR.setAttribute('x2',69+dx);}
  function animateLegs(baseX,t){const swing=Math.sin(t*12)*5;pLegL.setAttribute('x2',baseX-4+swing);pLegR.setAttribute('x2',baseX+4-swing);pLegL.setAttribute('y2',61);pLegR.setAttribute('y2',61);}
  function animateWave(t){pArmR.setAttribute('x2',72);pArmR.setAttribute('y2',39-Math.sin(t*4)*6);}
  function setDoor(f){doorLeft.setAttribute('transform',`translate(${-f*8},0)`);doorRight.setAttribute('transform',`translate(${f*8},0)`);}
  function spinWheels(dt,spd){if(Math.abs(spd)>0.1)wheelAngle+=spd*0.08;wheelR.setAttribute('transform',`rotate(${wheelAngle},28,67)`);wheelF.setAttribute('transform',`rotate(${wheelAngle},130,67)`);}
  function resetScene(){moveBus(BUS_START_X);setPassengerX(PASS_START_X);passenger.setAttribute('opacity','1');setDoor(0);pLegL.setAttribute('x2','61');pLegL.setAttribute('y2','61');pLegR.setAttribute('x2','69');pLegR.setAttribute('y2','61');pArmL.setAttribute('x2','58');pArmL.setAttribute('y2','39');pArmR.setAttribute('x2','72');pArmR.setAttribute('y2','39');wheelAngle=0;wheelR.removeAttribute('transform');wheelF.removeAttribute('transform');}
  function frame(ts){
    if(lastTime===null)lastTime=ts;
    if(loopStart===null)loopStart=ts;
    const dt=ts-lastTime, now=(ts-loopStart)%T.reset;
    lastTime=ts;
    if(now<T.busArrive[1]){const f=easeOut(frac(now,T.busArrive));moveBus(lerp(BUS_START_X,BUS_PARK_X,f));spinWheels(dt,-(BUS_PARK_X-BUS_START_X)*(1/60)*(1-frac(now,T.busArrive))*5);animateWave(now/1000);}
    if(now>=T.doorOpen[0]&&now<=T.doorOpen[1])setDoor(easeOut(frac(now,T.doorOpen)));
    if(now>=T.passWalk[0]&&now<=T.passWalk[1]){const f=easeInOut(frac(now,T.passWalk));const px=lerp(PASS_START_X,PASS_DOOR_X,f);setPassengerX(px);animateLegs(px,f);pArmR.setAttribute('x2',px+7-f*3);pArmR.setAttribute('y2',String(39+f*4));pArmL.setAttribute('x2',px-7);pArmL.setAttribute('y2',String(39+f*4));}
    if(now>=T.passBoard[0]&&now<=T.passBoard[1]){const f=frac(now,T.passBoard);passenger.setAttribute('opacity',String(1-f));setPassengerX(PASS_DOOR_X-f*8);}
    if(now>=T.doorClose[0]&&now<=T.doorClose[1])setDoor(1-easeOut(frac(now,T.doorClose)));
    if(now>=T.busLeave[0]&&now<=T.busLeave[1]){const f=easeIn(frac(now,T.busLeave));moveBus(lerp(BUS_PARK_X,BUS_END_X,f));spinWheels(dt,(BUS_END_X-BUS_PARK_X)/((T.busLeave[1]-T.busLeave[0])/16.7)*0.06);}
    if(now>=T.busLeave[1]&&now<T.reset)resetScene();
    requestAnimationFrame(frame);
  }
  resetScene();
  requestAnimationFrame(frame);
})();
</script>

<script>
const RESPONSAVEIS = [
  { keys: ['diretoria'], nome: 'Fausto', cargo: 'Diretoria' },
  { keys: ['recursos humanos', 'sala de treinamento'], nome: 'Patrícia', cargo: 'RH' },
  { keys: ['departamento pessoal', 'gerencia administrativa', 'gerência administrativa', 'suporte juridico'], nome: 'Valter', cargo: 'DP / Gerência Adm. e Suporte Jurídico' },
  { keys: ['sala de informática', 'informatica'], nome: 'Crisolando', cargo: 'TI' },
  { keys: ['cco', 'achados e perdidos', 'monitoramento', 'sala de reuniao', 'sala de reunião'], nome: 'Adriano', cargo: 'Monitoramento / CCO' },
  { keys: ['cftv', 'cft v', 'cftvv'], nome: 'Regiane', cargo: 'CFTV' },
  { keys: ['departamento finaceiro', 'departamento financeiro', 'gerencia financeira', 'gerência financeira'], nome: 'Brenda', cargo: 'Financeiro' },
  { keys: ['planejamento tecnico', 'planejamento técnico', 'planej.técnico', 'planej. técnico', 'planej. técnico operacional', 'planejamento tecnico operacional', 'planejamento tecnico operacional ctt'], nome: 'Marcos', cargo: 'Planejamento Operacional' },
  { keys: ['manutenção', 'manutencao', 'adm manutenção', 'mecânica', 'mecanica', 'lanternagem', 'borracharia', 'hospital pneus', 'pneumática', 'pneumatica', 'rampa de carros', 'sala de vidro', 'sala de recarga', 'deposito de lubrificantes', 'sucata', 'descarte', 'material reutilizavel', 'material reutilizável', 'lonas', 'contêiner', 'conteiner', 'recepção mecânica', 'recepcao mecanica'], nome: 'Júlio', cargo: 'Gerente de Manutenção' },
  { keys: ['sesmt', 'elétrica deposito', 'eletrica deposito'], nome: 'Fellipe', cargo: 'SESMT' },
  { keys: ['almoxarifado', 'produto de limpeza', 'quarto da limpeza', 'materiais de'], nome: 'Walisson', cargo: 'Almoxarifado' },
  { keys: ['ctt'], nome: 'José', cargo: 'CTT' },
  { keys: ['box 0', 'box 1', 'lava jato', 'posto de combustivel', 'posto de combustível', 'portaria', 'sala de descanso', 'departamento operacional', 'refeitório', 'refeitorio', 'copa', 'cozinha'], nome: 'Elenilson', cargo: 'Gerente Operacional' },
];

function getResponsavel(label) {
  const nm = v => v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const nl = nm(label);
  for (const r of RESPONSAVEIS) for (const k of r.keys) if (nl.includes(nm(k))) return r;
  return null;
}

const svg = document.getElementById('map');
let s=1, tx=0, ty=0, drag=false, lx=0, ly=0;
function fit(){s=Math.min(innerWidth/1440,innerHeight/810)*0.97;tx=(innerWidth-1440*s)/2;ty=(innerHeight-810*s)/2;apply();}
function apply(){svg.style.transformOrigin='0 0';svg.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;}
fit();
addEventListener('resize',fit);
window.addEventListener('wheel',e=>{if(e.target.closest('#search-panel,#nav-bar,#qr-link'))return;e.preventDefault();const f=e.deltaY<0?1.13:0.88;tx=e.clientX-(e.clientX-tx)*f;ty=e.clientY-(e.clientY-ty)*f;s*=f;apply();},{passive:false});
svg.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;document.body.classList.add('grabbing');});
addEventListener('mousemove',e=>{if(!drag)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;apply();});
addEventListener('mouseup',()=>{drag=false;document.body.classList.remove('grabbing');});
svg.addEventListener('dblclick',fit);

// Touch support for mobile
let touchDrag = false, initialDist = 0, initialScale = 1, initialTx = 0, initialTy = 0;
svg.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchDrag = true;
    lx = e.touches[0].clientX;
    ly = e.touches[0].clientY;
    document.body.classList.add('grabbing');
  } else if (e.touches.length === 2) {
    touchDrag = false;
    initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    initialScale = s;
    initialTx = tx;
    initialTy = ty;
  }
});
addEventListener('touchmove', e => {
  if (touchDrag && e.touches.length === 1) {
    tx += e.touches[0].clientX - lx;
    ty += e.touches[0].clientY - ly;
    lx = e.touches[0].clientX;
    ly = e.touches[0].clientY;
    apply();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const scale = initialScale * (dist / initialDist);
    s = Math.max(0.1, Math.min(5, scale));
    const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    tx = centerX - (centerX - initialTx) * (s / initialScale);
    ty = centerY - (centerY - initialTy) * (s / initialScale);
    apply();
  }
});
addEventListener('touchend', () => {
  touchDrag = false;
  document.body.classList.remove('grabbing');
});

let ld=null;
function isUI(e) {
  return Boolean(e.target.closest('#search-panel,#nav-bar,#qr-link,#resp-card'));
}

const input = document.getElementById('search-input');
const clearBtn = document.getElementById('search-clear');
const resultsEl = document.getElementById('search-results');
const navPrev = document.getElementById('nav-prev');
const navNext = document.getElementById('nav-next');
const navLabel = document.getElementById('nav-label');
const respCard = document.getElementById('resp-card');
const respLocalText = document.getElementById('resp-local-text');
const respNomeText = document.getElementById('resp-nome-text');
const respCargoText = document.getElementById('resp-cargo-text');
const highlightLayer = document.getElementById('highlight-layer');

const labels = Array.from(svg.querySelectorAll('#labels-layer text')).map(text => ({
  element: text,
  text: text.textContent.trim(),
  normalized: normalize(text.textContent),
  bbox: text.getBBox()
}));
let matches = [];
let currentIndex = -1;

function normalize(value) {
  return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function clearHighlight() {
  highlightLayer.innerHTML = '';
  labels.forEach(item => item.element.setAttribute('fill', '#00ff41'));
}

function highlightItem(item) {
  clearHighlight();
  const { x, y, width, height } = item.bbox;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x - 6);
  rect.setAttribute('y', y - height * 0.65);
  rect.setAttribute('width', width + 12);
  rect.setAttribute('height', height * 1.5);
  rect.setAttribute('rx', '4');
  rect.setAttribute('ry', '4');
  rect.setAttribute('stroke', '#00ff41');
  rect.setAttribute('stroke-width', '1');
  rect.setAttribute('fill', 'none');
  rect.classList.add('highlight-ring');
  highlightLayer.appendChild(rect);
}

function updateNav() {
  navLabel.textContent = matches.length ? `${currentIndex + 1} / ${matches.length}` : '0 / 0';
}

function showResultDetails(item) {
  respLocalText.textContent = item.text;
  const owner = getResponsavel(item.text) || { nome: 'Não encontrado', cargo: 'Responsável desconhecido' };
  respNomeText.textContent = owner.nome;
  respCargoText.textContent = owner.cargo;
  respCard.classList.add('visible');
}

function selectResult(index) {
  if (index < 0 || index >= matches.length) return;
  currentIndex = index;
  matches.forEach((item, idx) => {
    item.resultEl.classList.toggle('active', idx === index);
    item.element.setAttribute('fill', idx === index ? '#ffffff' : '#00ff41');
  });
  updateNav();
  highlightItem(matches[index]);
  showResultDetails(matches[index]);
}

function renderResults() {
  resultsEl.innerHTML = '';
  resultsEl.style.display = 'block';
  clearBtn.style.display = input.value ? 'flex' : 'none';

  if (!matches.length) {
    const none = document.createElement('div');
    none.className = 'result-none';
    none.textContent = 'Nenhum resultado';
    resultsEl.appendChild(none);
    updateNav();
    clearHighlight();
    respCard.classList.remove('visible');
    return;
  }

  const count = document.createElement('div');
  count.className = 'result-count';
  count.textContent = `${matches.length} resultado${matches.length > 1 ? 's' : ''}`;
  resultsEl.appendChild(count);

  matches.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'result-item';
    row.textContent = item.text;
    row.addEventListener('click', () => selectResult(idx));
    resultsEl.appendChild(row);
    item.resultEl = row;
  });

  currentIndex = 0;
  selectResult(0);
}

function updateSearch() {
  const query = normalize(input.value.trim());
  if (!query) {
    clearSearch();
    return;
  }
  matches = labels.filter(item => item.normalized.includes(query));
  renderResults();
}

function clearSearch() {
  input.value = '';
  resultsEl.style.display = 'none';
  clearBtn.style.display = 'none';
  matches = [];
  currentIndex = -1;
  updateNav();
  clearHighlight();
  respCard.classList.remove('visible');
}

clearBtn.addEventListener('click', clearSearch);
input.addEventListener('input', updateSearch);
navPrev.addEventListener('click', () => {
  if (!matches.length) return;
  selectResult((currentIndex - 1 + matches.length) % matches.length);
});
navNext.addEventListener('click', () => {
  if (!matches.length) return;
  selectResult((currentIndex + 1) % matches.length);
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSearch();
});

clearSearch();
</script>
